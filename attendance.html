<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>報到管理台 · Tayvan Tedarikçi Buluşması 2026</title>
<style>
:root{--navy:#0B2140;--gold:#C9A552;--ice:#EEF2F7;--ink:#0B1622;--muted:#5A6B80;--ok:#1E7A5B;--danger:#A3342B;--line:rgba(11,33,64,.14)}
*{box-sizing:border-box}body{margin:0;background:var(--ice);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans TC",Arial,sans-serif}.wrap{max-width:1180px;margin:auto;padding:0 18px 48px}.bar{background:var(--navy);color:#fff;border-bottom:3px solid var(--gold)}.bar .wrap{padding-top:15px;padding-bottom:15px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}.bar h1{font-size:19px;margin:0}.sp{margin-left:auto;color:#d5dfec;font-size:13px}.gate{max-width:390px;margin:70px auto;background:#fff;border:1px solid var(--line);border-radius:14px;padding:22px;box-shadow:0 12px 30px rgba(11,33,64,.09)}.gate h2{margin:0 0 5px;font-size:20px}.gate p{margin:0 0 16px;color:var(--muted);font-size:13px}label{display:block;font-size:13px;font-weight:600;margin:10px 0 5px}input,select,button{font:inherit}input,select{border:1.5px solid var(--line);border-radius:9px;padding:10px 12px;background:#fff}.gate input{width:100%;font-size:16px}.btn{border:0;border-radius:9px;background:var(--navy);color:#fff;padding:10px 14px;font-weight:600;cursor:pointer}.gate .btn{width:100%;margin-top:14px;padding:13px}.btn[disabled]{opacity:.55;cursor:not-allowed}.ghost{background:#fff;color:var(--navy);border:1.5px solid var(--line)}.danger{color:var(--danger)!important}.good{color:var(--ok)!important}#app{display:none}.stats{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0 14px}.stat{background:#fff;border:1px solid var(--line);border-radius:11px;padding:12px 18px;min-width:120px}.stat b{font-size:28px;display:block}.stat span{font-size:12px;color:var(--muted)}.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}.tools input{flex:1;min-width:210px}.banner{padding:10px 13px;border-radius:10px;font-size:13px;margin-bottom:12px}.banner.warn{background:#FBF6E9;border:1px solid rgba(201,165,82,.45);color:#6B551A}.banner.good{background:#F2F7F4;border:1px solid rgba(30,122,91,.3);color:#1B4E3D}.banner.bad{background:#FBEFEE;border:1px solid rgba(163,52,43,.35);color:#7E2820}.tablewrap{overflow:auto;max-height:63vh;background:#fff;border:1px solid var(--line);border-radius:11px}table{border-collapse:collapse;width:100%;font-size:14px}th,td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}th{position:sticky;top:0;background:#F6F8FB;color:var(--muted);font-size:12.5px;z-index:1}.yes{color:var(--ok);font-weight:700}.no{color:var(--danger);font-weight:600}.empty{text-align:center;padding:34px;color:var(--muted)}.logout{background:transparent;border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:8px;padding:6px 10px;font-size:13px;cursor:pointer}@media(max-width:700px){.hide-sm{display:none}.stat{min-width:96px;padding:10px 12px}.stat b{font-size:24px}.tools .btn{flex:1}.sp{width:100%;margin-left:0}}
</style>
</head>
<body>
<div id="gate" class="gate">
  <h2>報到管理台</h2>
  <p>僅限活動工作人員。請使用 Firebase Authentication 帳號登入。</p>
  <label for="email">Email</label>
  <input id="email" type="email" autocomplete="username" placeholder="name@taitra.org.tw">
  <label for="pw">密碼</label>
  <input id="pw" type="password" autocomplete="current-password" placeholder="Firebase 登入密碼">
  <button id="enter" class="btn" type="button">登入</button>
  <p id="pwmsg" class="danger" style="margin-top:10px"></p>
</div>
<div id="app">
  <div class="bar"><div class="wrap">
    <h1>報到管理台 · 2026/09/23 Istanbul</h1>
    <span class="sp" id="sync">尚未同步</span>
    <button id="logout" class="logout" type="button">登出</button>
  </div></div>
  <main class="wrap">
    <div class="stats">
      <div class="stat"><b id="total">0</b><span>應到</span></div>
      <div class="stat"><b id="in">0</b><span>已報到</span></div>
      <div class="stat"><b id="out">0</b><span>未報到</span></div>
      <div class="stat"><b id="rate">0%</b><span>報到率</span></div>
    </div>
    <div class="banner warn" id="contactNote">第一次請用「原本匯入買主名單的那台瀏覽器」登入本頁；系統會把該瀏覽器保存的 Email／電話安全同步到受保護 contacts。之後其他已授權裝置登入，也能取得完整聯絡資料。</div>
    <div class="banner good" id="contactOk" hidden></div>
    <div class="banner bad" id="errBanner" hidden></div>
    <div class="tools">
      <input id="q" type="text" placeholder="搜尋姓名 / 公司 / Email / 電話 / 代碼">
      <select id="f"><option value="all">全部</option><option value="in">已報到</option><option value="out">未報到</option></select>
      <button id="refresh" class="btn ghost" type="button">立即更新</button>
      <button id="syncContacts" class="btn ghost" type="button">同步本機聯絡資料</button>
      <button id="exportView" class="btn ghost" type="button">匯出目前畫面</button>
      <button id="exportOut" class="btn" type="button">匯出未報到 CSV</button>
    </div>
    <div class="tablewrap"><table>
      <thead><tr><th>狀態</th><th>報到時間</th><th>姓名</th><th>公司</th><th>Email</th><th>電話</th><th>代碼</th></tr></thead>
      <tbody id="rows"></tbody>
    </table><div id="empty" class="empty" hidden>沒有符合的資料</div></div>
  </main>
</div>
<script>
(function(){
'use strict';
var API_KEY='AIzaSyD6xHVWGzri9i84d_Rt02iIb8J7v95Y4BE';
var DB='https://project-6961535532325995238-default-rtdb.europe-west1.firebasedatabase.app';
var EVENT='istanbul-2026-09-23';
var BASE=DB+'/stageTool/checkin/'+EVENT;
var GUESTS=BASE+'/guests.json';
var CONTACTS=BASE+'/contacts.json';
var LS='ck2Guests';
var token='',guests={},contacts={},timer=null;
function $(s){return document.querySelector(s)}
function esc(s){return String(s==null?'':s).replace(/[&<>\"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]})}
function csv(v){v=String(v==null?'':v);return /[\",\n]/.test(v)?'\"'+v.replace(/\"/g,'\"\"')+'\"':v}
function pad(n){return n<10?'0'+n:n}
function tsName(){var d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+'_'+pad(d.getHours())+'-'+pad(d.getMinutes())}
function time(v){if(!v)return '';var d=new Date(v);return pad(d.getHours())+':'+pad(d.getMinutes())}
function fullTime(v){if(!v)return '';var d=new Date(v);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+' '+pad(d.getHours())+':'+pad(d.getMinutes())+':'+pad(d.getSeconds())}
function localGuests(){try{return JSON.parse(localStorage.getItem(LS)||'{}')||{}}catch(e){return {}}}
function authUrl(){return 'https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key='+encodeURIComponent(API_KEY)}
function authFetch(url,opt){opt=opt||{};var sep=url.indexOf('?')>=0?'&':'?';return fetch(url+sep+'auth='+encodeURIComponent(token),opt)}
function mergeAll(){var out={};Object.keys(guests||{}).forEach(function(k){var g=guests[k]||{},c=(contacts||{})[k]||{};out[k]={name:g.name||'',org:g.org||'',mail:c.mail||'',tel:c.tel||'',checkedAt:g.checkedAt||null}});return out}
function currentRows(){var all=mergeAll(),q=$('#q').value.trim().toLowerCase(),f=$('#f').value;return Object.keys(all).filter(function(k){var g=all[k];if(f==='in'&&!g.checkedAt)return false;if(f==='out'&&g.checkedAt)return false;if(!q)return true;return (k+' '+g.name+' '+g.org+' '+g.mail+' '+g.tel).toLowerCase().indexOf(q)>=0}).sort(function(a,b){return (all[a].name||'').localeCompare(all[b].name||'','tr')}).map(function(k){return [k,all[k]]})}
function render(){var all=mergeAll(),keys=Object.keys(all),inside=keys.filter(function(k){return all[k].checkedAt});$('#total').textContent=keys.length;$('#in').textContent=inside.length;$('#out').textContent=keys.length-inside.length;$('#rate').textContent=keys.length?Math.round(inside.length/keys.length*100)+'%':'0%';var rows=currentRows(),tb=$('#rows');tb.innerHTML='';rows.forEach(function(x){var k=x[0],g=x[1],tr=document.createElement('tr');tr.innerHTML='<td class="'+(g.checkedAt?'yes':'no')+'">'+(g.checkedAt?'已報到':'未報到')+'</td><td>'+(g.checkedAt?esc(time(g.checkedAt)):'—')+'</td><td>'+esc(g.name)+'</td><td>'+esc(g.org)+'</td><td>'+esc(g.mail)+'</td><td>'+esc(g.tel)+'</td><td>'+esc(k)+'</td>';tb.appendChild(tr)});$('#empty').hidden=!!rows.length}
function setErr(msg){var b=$('#errBanner');b.textContent=msg||'';b.hidden=!msg}
function refresh(){if(!token)return Promise.reject(new Error('尚未登入'));setErr('');$('#sync').textContent='同步中…';return Promise.all([
  fetch(GUESTS,{cache:'no-store'}).then(function(r){if(!r.ok)throw new Error('guests HTTP '+r.status);return r.json()}),
  authFetch(CONTACTS,{cache:'no-store'}).then(function(r){if(!r.ok)throw new Error('contacts HTTP '+r.status);return r.json()})
]).then(function(v){guests=v[0]||{};contacts=v[1]||{};$('#sync').textContent='雲端同步 '+new Date().toLocaleTimeString('zh-TW',{hour12:false});render();return true}).catch(function(e){setErr('同步失敗：'+e.message);$('#sync').textContent='同步失敗';throw e})}
function localContactPayload(){var l=localGuests(),out={};Object.keys(l).forEach(function(k){var g=l[k]||{};if(g.mail||g.tel)out[k]={mail:g.mail||'',tel:g.tel||''}});return out}
function uploadLocalContacts(){if(!token)return Promise.reject(new Error('尚未登入'));var payload=localContactPayload(),n=Object.keys(payload).length;if(!n){$('#contactOk').hidden=true;$('#contactNote').hidden=false;setErr('這台瀏覽器找不到 Email／電話。請改用原本在 checkin.html 匯入名單的那台電腦開啟此頁，再按「同步本機聯絡資料」。');return Promise.resolve(0)}setErr('');return authFetch(CONTACTS,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)}).then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.json()}).then(function(){var b=$('#contactOk');b.textContent='已安全同步 '+n+' 筆 Email／電話到受保護 contacts。';b.hidden=false;$('#contactNote').hidden=true;return refresh().then(function(){return n})}).catch(function(e){setErr('聯絡資料同步失敗：'+e.message);throw e})}
function login(){var email=$('#email').value.trim(),pw=$('#pw').value;if(!email||!pw){$('#pwmsg').textContent='請輸入 Email 和密碼';return}$('#enter').disabled=true;$('#pwmsg').textContent='登入中…';fetch(authUrl(),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:email,password:pw,returnSecureToken:true})}).then(function(r){return r.json().then(function(j){if(!r.ok)throw new Error((j.error&&j.error.message)||'LOGIN_FAILED');return j})}).then(function(j){token=j.idToken;$('#pw').value='';$('#gate').style.display='none';$('#app').style.display='block';$('#pwmsg').textContent='';return refresh()}).then(function(){return uploadLocalContacts()}).catch(function(e){if(!token){var m=e.message||'';$('#pwmsg').textContent=(m.indexOf('INVALID_LOGIN_CREDENTIALS')>=0||m.indexOf('INVALID_PASSWORD')>=0||m.indexOf('EMAIL_NOT_FOUND')>=0)?'Email 或密碼不正確':'登入失敗：'+m}else{setErr('登入成功，但資料同步發生問題：'+e.message)}}).finally(function(){$('#enter').disabled=false;if(token&&!timer)timer=setInterval(function(){refresh().catch(function(){})},30000)})}
function logout(){token='';guests={};contacts={};if(timer){clearInterval(timer);timer=null}$('#app').style.display='none';$('#gate').style.display='block';$('#sync').textContent='尚未同步'}
function download(rows,label){var head=['狀態','報到時間','代碼','姓名','公司','Email','電話'];var lines=[head.map(csv).join(',')];rows.forEach(function(x){var k=x[0],g=x[1];lines.push([g.checkedAt?'已報到':'未報到',fullTime(g.checkedAt),k,g.name,g.org,g.mail,g.tel].map(csv).join(','))});var blob=new Blob(['\ufeff'+lines.join('\r\n')],{type:'text/csv;charset=utf-8'});var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=label+'_'+tsName()+'.csv';document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},500)}
function exportOut(){refresh().then(function(){var all=mergeAll(),rows=Object.keys(all).filter(function(k){return !all[k].checkedAt}).sort(function(a,b){return (all[a].name||'').localeCompare(all[b].name||'','tr')}).map(function(k){return [k,all[k]]});download(rows,'not_checked_in')}).catch(function(){})}
$('#enter').onclick=login;$('#pw').addEventListener('keydown',function(e){if(e.key==='Enter')login()});$('#email').addEventListener('keydown',function(e){if(e.key==='Enter')$('#pw').focus()});$('#logout').onclick=logout;$('#q').oninput=render;$('#f').onchange=render;$('#refresh').onclick=function(){refresh().catch(function(){})};$('#syncContacts').onclick=function(){uploadLocalContacts().catch(function(){})};$('#exportView').onclick=function(){download(currentRows(),'attendance_view')};$('#exportOut').onclick=exportOut;
})();
</script>
</body>
</html>
